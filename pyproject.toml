[project]
name = "ZaloProductImporter"
version = "0.1.0"
description = "Bulk create Zalo product catalog items from JSON input."
requires-python = ">=3.10"
authors = [
  { name = "@taphoaneil" },
]
license = "MIT"
dependencies = [
  "Pillow>=10.0.0",
  "pycryptodome>=3.20.0",
  "requests>=2.31.0",
]

[project.scripts]
ZaloProductImporter = "zalo_product_importer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
